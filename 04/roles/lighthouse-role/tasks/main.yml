---
- name: Install Nginx
  become: true
  ansible.builtin.package:
    name: nginx
    state: present
- name: Clone the Lighthouse repo
  become: true
  ansible.builtin.git:
    repo: https://github.com/VKCOM/lighthouse.git
    dest: "{{ project_folder }}"
    version: master
    force: true
- name: Set web root permissions
  become: true
  ansible.builtin.file:
    path: "{{ project_folder }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
    recurse: true
- name: Create nginx configuration file
  become: true
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/default.conf
    mode: "0644"
  notify: Restart nginx server
