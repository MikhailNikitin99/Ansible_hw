---
- name: Install Nginx
  become: true
  ansible.builtin.package:
    name: nginx
    state: present
- name: Clone the Lighthouse repo
  become: true
  ansible.builtin.git:
    repo: https://github.com/VKCOM/lighthouse.git
    dest: "{{ lighthouse_folder }}"
    version: master
    force: true
- name: Set web root permissions
  become: true
  ansible.builtin.file:
    path: "{{ lighthouse_folder }}"
    state: directory
    owner: root
    group: root
    mode: "u=rwX,go=rX"
    recurse: true
- name: Create nginx configuration file
  become: true
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ lighthouse_nginx_config_path }}"
    mode: "0644"
  notify: Restart nginx server
