---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python 3, git and CA certs on Ubuntu
      ansible.builtin.raw: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y python3 ca-certificates git
          fi
      args:
        executable: /bin/sh
      changed_when: false

    - name: Install Python 3 and git on Oracle linux
      ansible.builtin.raw: |
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y git ca-certificates
            if ! command -v python3.9 >/dev/null 2>&1; then
              dnf module enable -y python39 && dnf module install -y python39
            fi
          fi
      args:
        executable: /bin/sh
      changed_when: false
