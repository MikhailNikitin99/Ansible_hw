---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: ubuntu
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    override_command: false
    systemd: true
  - name: oraclelinux8
    image: mpaivabarbosa/molecule-systemd-oraclelinux:8
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    override_commands: false
    systemd: true

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_LOAD_CALLBACK_PLUGINS: "1"
  config_options:
    defaults:
      host_key_checking: false
      deprecation_warnings: false
      verbosity: 1
    ssh_connection:
      pipelining: true
  options:
    diff: true
  playbooks:
    create: create.yml
    converge: converge.yml
    destroy: destroy.yml
    prepare: prepare.yml
    verify: verify.yml
verifier:
  name: ansible

