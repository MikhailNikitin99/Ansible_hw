---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python 3 and CA certs on Ubuntu
      ansible.builtin.raw: |
          if command -v apt-get >/dev/null 2>&1 && ! command -v python3 >/dev/null 2>&1; then
            apt-get update && apt-get install -y python3 ca-certificates
          fi
      changed_when: false

    - name: Install Python 3 on Oracle linux
      ansible.builtin.raw: |
          if command -v dnf >/dev/null 2>&1; then
            dnf module enable -y python39 && dnf module install -y python39
          fi
      changed_when: false
